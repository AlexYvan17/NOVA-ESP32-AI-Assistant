
; ==================================================
; NOVA AI Assistant
; ESP32-S3-WROOM-1-N16R8
; Phase 1 + Phase 2: ST7789 Display
; ==================================================

[env:esp32-s3-devkitc-1]

; ---------- Platform ----------
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---------- Flash and PSRAM ----------
; Preserve working Phase 1 memory configuration

board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi

; ---------- Serial Monitor ----------
monitor_speed = 115200
upload_port = COM9
monitor_port = COM9

; ---------- Libraries ----------
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git

; ---------- Build Configuration ----------
build_flags =
    ; Enable external PSRAM
    -DBOARD_HAS_PSRAM

    ; Use UART0 for Serial output
    -DARDUINO_USB_CDC_ON_BOOT=0

    ; Use custom TFT_eSPI configuration
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1

    ; Display driver
    -DST7789_DRIVER=1

    ; Display resolution
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320

    ; Display SPI pins
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=13
    -DTFT_DC=9
    -DTFT_RST=10

    ; SPI clock: 20 MHz
    -DSPI_FREQUENCY=20000000

; ==================================================
; END OF NOVA CONFIGURATION
; ==================================================
